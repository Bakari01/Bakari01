<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="240" viewBox="0 0 1100 240">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#0ea5a4">
        <animate attributeName="stop-color" values="#0ea5a4;#7c3aed;#0ea5a4" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#06b6d4;#7c3aed" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1100" height="240" rx="16" fill="url(#g)"/>
  <g transform="translate(40,40)">
    <text x="0" y="60" font-family="Segoe UI, Roboto, Helvetica" font-size="48" fill="#fff" font-weight="700">Bakari Hamisi</text>
    <text x="0" y="110" font-family="Segoe UI, Roboto, Helvetica" font-size="22" fill="#e6fffa">Data Scientist • Machine Learning Engineer • Researcher</text>
    <g transform="translate(700,10)">
      <rect x="0" y="0" width="320" height="160" rx="10" fill="#ffffff10" />
      <text x="18" y="44" font-family="Segoe UI, Roboto" font-size="16" fill="#fff">Open to:</text>
      <text x="18" y="74" font-family="Segoe UI, Roboto" font-size="14" fill="#fff">Research collaborations</text>
      <text x="18" y="100" font-family="Segoe UI, Roboto" font-size="14" fill="#fff">ML engineering roles</text>
    </g>
  </g>
</svg>